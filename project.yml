name: PastelFocus
options:
  bundleIdPrefix: com.ammarghazal
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 58FZ49BXRF
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
packages:
  PastelFocusCore:
    path: .
targets:
  PastelFocus:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: PastelFocusCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PastelFocus
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Local-first focus and tasks for Ammar"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ammarghazal.pastelfocus
        PRODUCT_NAME: PastelFocus
